gbis:
  base-url: http://127.0.0.1:18080
  daily-limit: 100000

collection:
  enabled: true
  # 운영 worker와 같은 시간대별 수집 주기를 사용한다.
  # 가짜 GBIS에서 재생하는 기존 8개만 수집한다.
  route-ids:
    - "204000057" # 3330
    - "234000050" # 1650
    - "204000070" # 9007
    - "234000886" # 9300
    - "233000392" # 6011
    - "227000038" # 3000
    - "228000184" # 5600
    - "234000051" # 3500

route-geometry:
  enabled: true
  include-catalog: true

forecast:
  enabled: true
  interval: 10s
  settlement-interval: 60s

model:
  bundle:
    directory: /srv/salmonbus-dev/models/reference-20261002
    promote-on-start: false
